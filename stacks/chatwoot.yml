# Chatwoot — caixa de atendimento do WhatsApp
#
# Desenho e o porquê de cada escolha: docs/2026-08-11-chatwoot-design.md
#
# Deploy: deploy-chatwoot.sh (não rode docker stack deploy na mão — as
# variáveis ${...} abaixo saem de vps.env e de /opt/infra/chatwoot/chatwoot.env,
# que guarda as senhas e NÃO é versionado).
#
# Nenhum serviço publica porta no host: quem publica é só o Traefik. Banco e
# Redis nem chegam à rede pública — ficam na overlay interna desta stack.

services:
  postgres:
    # pgvector, e não Postgres puro, porque é o que o compose oficial do
    # Chatwoot usa: as funções de IA da v4 dependem da extensão. Não custa
    # nada hoje e evita uma migração chata no dia em que forem ligadas.
    image: ${CHATWOOT_PG_IMAGEM}
    environment:
      POSTGRES_DB: chatwoot_production
      POSTGRES_USER: chatwoot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # o Chatwoot cria as próprias tabelas; isto é só o encoding do cluster
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres:/var/lib/postgresql/data
    networks:
      - interna
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatwoot -d chatwoot_production"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 1G
      restart_policy:
        condition: any
        delay: 5s

  redis:
    image: ${CHATWOOT_REDIS_IMAGEM}
    # $$ vira $ literal: quem expande é o shell dentro do container, não o
    # docker stack deploy. Sem o escape, a senha apareceria no YAML expandido.
    command: ["sh", "-c", "redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis:/data
    networks:
      - interna
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 256M
      restart_policy:
        condition: any
        delay: 5s

  rails:
    image: chatwoot/chatwoot:${CHATWOOT_VERSAO}
    # ⚠️ O entrypoint oficial NÃO prepara o schema — ao contrário do que o nome
    # sugere, ele só espera o Postgres responder, confere o bundle e executa o
    # comando. Instalação nova exige `rails db:chatwoot_prepare` na mão (ver
    # README.md §Chatwoot); sem isso o serviço sobe e morre em loop com
    # `relation "installation_configs" does not exist`.
    entrypoint: docker/entrypoints/rails.sh
    command: ["bundle", "exec", "rails", "s", "-p", "3000", "-b", "0.0.0.0"]
    environment: &chatwoot_env
      RAILS_ENV: production
      NODE_ENV: production
      INSTALLATION_ENV: docker
      RAILS_LOG_TO_STDOUT: "true"
      LOG_LEVEL: info
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      FRONTEND_URL: https://${CHATWOOT_HOST}
      DEFAULT_LOCALE: pt_BR
      # ── a configuração mais importante desta instalação ──────────────────
      # Sem isto, qualquer pessoa que abrir o painel na internet cria uma
      # conta e entra. Painel exposto + cadastro aberto = porta destrancada.
      ENABLE_ACCOUNT_SIGNUP: "false"
      # anexos em volume local. Um bucket externo é mais superfície de exposição
      # do que ganho neste porte — e o volume local já é backupeado (veja
      # docs/retencao-e-backup.md). Reveja se o seu volume de anexos crescer.
      ACTIVE_STORAGE_SERVICE: local
      # ── retenção: nunca apagar (ESCOLHA SUA — veja docs/retencao-e-backup.md)
      # Se você quiser prazo de expiração, é aqui que se mexe. Mas leia o doc
      # antes: essa decisão muda o que o seu backup precisa cobrir.
      # Já é o padrão de fábrica; está aqui escrito para a decisão ficar
      # visível a quem ler a stack, e para nenhum "otimizador" ligar depois
      # sem saber. Este job apagaria contact_inbox sem conversa com +90 dias.
      # O que MESMO garante o histórico está em docs/retencao-e-backup.md.
      REMOVE_STALE_CONTACT_INBOX_JOB_STATUS: "false"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DATABASE: chatwoot_production
      POSTGRES_USERNAME: chatwoot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_URL: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      RAILS_MAX_THREADS: "5"
      WEB_CONCURRENCY: "2"
    volumes:
      # mesmo volume no rails e no sidekiq: funciona porque o Swarm tem um nó
      # só. Com um segundo nó isso quebra — aí a saída é S3/MinIO ou prender
      # os dois serviços ao mesmo nó. Está explicado em docs/por-que-este-padrao.md.
      - storage:/app/storage
    networks:
      - interna
      # única porta de contato com o mundo: é aqui que o Traefik enxerga
      - ${REDE_INTERNA}
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 2G
      restart_policy:
        # o Swarm ignora depends_on: o rails sobe antes do banco estar pronto,
        # morre, e volta. É esperado nos primeiros segundos de um deploy novo.
        condition: any
        delay: 10s
      update_config:
        order: start-first
      labels:
        - traefik.enable=true
        # é traefik.swarm.network, não traefik.docker.network — a label antiga
        # é ignorada em silêncio no v3 e o sintoma é "bad gateway" sem log
        - traefik.swarm.network=${REDE_INTERNA}
        - traefik.http.routers.chatwoot.rule=Host(`${CHATWOOT_HOST}`)
        - traefik.http.routers.chatwoot.entrypoints=websecure
        - traefik.http.routers.chatwoot.tls.certresolver=le
        - traefik.http.routers.chatwoot.middlewares=seguranca@file
        - traefik.http.services.chatwoot.loadbalancer.server.port=3000

  sidekiq:
    image: chatwoot/chatwoot:${CHATWOOT_VERSAO}
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]
    # mesmas variáveis do rails, sem duplicar a lista
    environment: *chatwoot_env
    volumes:
      - storage:/app/storage
    networks:
      - interna
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 1G
      restart_policy:
        condition: any
        delay: 10s

networks:
  # overlay própria da stack: banco e Redis não são alcançáveis nem pelos
  # outros containers da VPS. Some junto se a stack for removida, e isso é
  # desejado — ao contrário da network_public, que é externa de propósito.
  interna:
    driver: overlay
    # attachable permite `docker run` avulso nesta rede — é o que faz o
    # chatwoot-rails.sh funcionar (migração, criar usuário, console). Sem
    # isso, só containers de serviço entram, e o Swarm não tem equivalente
    # do `docker compose run`. Quem abusaria disso precisa ser root na VPS,
    # e aí já teria o banco de qualquer forma.
    attachable: true

  network_public:
    external: true
    name: ${REDE_INTERNA}

volumes:
  # o Swarm prefixa com o nome da stack: chatwoot_postgres, chatwoot_redis,
  # chatwoot_storage
  postgres:
  redis:
  storage:
